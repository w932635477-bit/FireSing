<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, "PingFang SC", sans-serif; background: #fafafa; width: 1080px; height: 1920px; overflow: hidden; }

/* Header */
.header { background: #fff; padding: 60px 40px 30px; text-align: center; border-bottom: 1px solid #eee; }
.header-label { font-size: 28px; color: #999; }
.header-date { font-size: 24px; color: #bbb; margin-top: 8px; }

/* Big number */
.hero { background: #fff; padding: 50px 40px 60px; text-align: center; }
.hero-amount { font-size: 96px; font-weight: 700; color: #4caf50; letter-spacing: -2px; }
.hero-amount .currency { font-size: 56px; vertical-align: top; line-height: 1.3; }
.hero-subtitle { font-size: 28px; color: #999; margin-top: 12px; }

/* Breakdown */
.breakdown { background: #fff; border-radius: 20px; margin: 24px 30px; padding: 36px; }
.breakdown-title { font-size: 28px; font-weight: 600; color: #222; margin-bottom: 30px; }
.breakdown-item { margin-bottom: 28px; }
.breakdown-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.breakdown-name { font-size: 26px; color: #444; }
.breakdown-detail { font-size: 24px; color: #999; }
.breakdown-amount { font-size: 28px; font-weight: 700; color: #4caf50; }
.breakdown-bar-bg { height: 20px; background: #f0f0f0; border-radius: 10px; overflow: hidden; }
.breakdown-bar-fill { height: 100%; border-radius: 10px; background: linear-gradient(90deg, #66bb6a, #4caf50); }

/* Divider */
.divider { height: 1px; background: #eee; margin: 0 30px; }

/* Insight card */
.insight { background: #fff; border-radius: 20px; margin: 24px 30px; padding: 36px; }
.insight-title { font-size: 28px; font-weight: 600; color: #222; margin-bottom: 20px; }
.insight-row { display: flex; justify-content: space-between; padding: 12px 0; }
.insight-label { font-size: 26px; color: #666; }
.insight-value { font-size: 26px; color: #222; font-weight: 500; }

/* Summary footer */
.summary { position: absolute; bottom: 80px; left: 0; right: 0; text-align: center; padding: 30px; }
.summary-text { font-size: 30px; color: #666; line-height: 1.6; }
.summary-highlight { color: #4caf50; font-weight: 700; }
</style>
</head>
<body>
<div class="header">
  <div class="header-label">第二个月收入</div>
  <div class="header-date">2025.01</div>
</div>
<div class="hero">
  <div class="hero-amount"><span class="currency">¥</span>4,236</div>
  <div class="hero-subtitle">来自闲鱼服务收入</div>
</div>
<div class="breakdown">
  <div class="breakdown-title">收入明细</div>
  <div class="breakdown-item">
    <div class="breakdown-header">
      <div>
        <div class="breakdown-name">审报价单</div>
        <div class="breakdown-detail">x12 单</div>
      </div>
      <div class="breakdown-amount">¥1,188</div>
    </div>
    <div class="breakdown-bar-bg">
      <div class="breakdown-bar-fill" style="width:28%"></div>
    </div>
  </div>
  <div class="breakdown-item">
    <div class="breakdown-header">
      <div>
        <div class="breakdown-name">全程陪同买材料</div>
        <div class="breakdown-detail">x3 单</div>
      </div>
      <div class="breakdown-amount">¥2,400</div>
    </div>
    <div class="breakdown-bar-bg">
      <div class="breakdown-bar-fill" style="width:57%"></div>
    </div>
  </div>
  <div class="breakdown-item">
    <div class="breakdown-header">
      <div>
        <div class="breakdown-name">线上咨询</div>
        <div class="breakdown-detail">x8 单</div>
      </div>
      <div class="breakdown-amount">¥648</div>
    </div>
    <div class="breakdown-bar-bg">
      <div class="breakdown-bar-fill" style="width:15%"></div>
    </div>
  </div>
</div>
<div class="divider"></div>
<div class="insight">
  <div class="insight-title">数据洞察</div>
  <div class="insight-row">
    <span class="insight-label">客单价（最高）</span>
    <span class="insight-value">¥800 / 全程陪同</span>
  </div>
  <div class="insight-row">
    <span class="insight-label">客单价（最低）</span>
    <span class="insight-value">¥81 / 线上咨询</span>
  </div>
  <div class="insight-row">
    <span class="insight-label">服务总单数</span>
    <span class="insight-value">23 单</span>
  </div>
  <div class="insight-row">
    <span class="insight-label">好评率</span>
    <span class="insight-value" style="color:#4caf50">100%</span>
  </div>
</div>
<div class="summary">
  <div class="summary-text">没找到工作<br>但<span class="summary-highlight">经验在帮我赚钱</span></div>
</div>
</body>
</html>
