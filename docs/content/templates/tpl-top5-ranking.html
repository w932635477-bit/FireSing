<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, "PingFang SC", sans-serif; background: #0a0a0a; width: 1080px; height: 1920px; overflow: hidden; color: #ffffff; }
.title { position: absolute; top: 120px; left: 60px; right: 60px; }
.title-main { font-size: 72px; font-weight: 900; color: #ffffff; line-height: 1.2; }
.title-main .red { color: #ff3333; }
.title-sub { font-size: 28px; color: #666666; margin-top: 20px; }
.list { position: absolute; top: 420px; left: 60px; right: 60px; }
.item { display: flex; align-items: center; padding: 44px 0; border-bottom: 2px solid #1a1a1a; }
.item-num { font-size: 64px; font-weight: 900; width: 100px; color: #ff3333; flex-shrink: 0; }
.item-num.dim { color: #333333; }
.item-info { flex: 1; }
.item-name { font-size: 48px; font-weight: 700; color: #ffffff; }
.item-data { font-size: 24px; color: #666666; margin-top: 8px; }
.item.final { border-bottom: none; }
.item.final .item-num { color: #ff0000; font-size: 80px; }
.item.final .item-name { font-size: 56px; color: #ff3333; }
.item.final .item-data { font-size: 28px; color: #ff6666; }
</style>
</head>
<body>
<div class="title">
  <div class="title-main"><span class="red">2026</span> 裁员最狠<br/>行业 TOP5</div>
  <div class="title-sub">数据来源：Rest of World / 国家统计局</div>
</div>
<div class="list">
  <div class="item">
    <div class="item-num dim">5</div>
    <div class="item-info">
      <div class="item-name">教育培训</div>
      <div class="item-data">60万人失业 · 机构倒闭率>70%</div>
    </div>
  </div>
  <div class="item">
    <div class="item-num dim">4</div>
    <div class="item-info">
      <div class="item-name">制造业</div>
      <div class="item-data">产业转移+自动化 · 沿海裁员潮</div>
    </div>
  </div>
  <div class="item">
    <div class="item-num dim">3</div>
    <div class="item-info">
      <div class="item-name">新能源汽车</div>
      <div class="item-data">产能过剩 · 头部裁员10%+</div>
    </div>
  </div>
  <div class="item">
    <div class="item-num">2</div>
    <div class="item-info">
      <div class="item-name">房地产</div>
      <div class="item-data">三年寒冬 · 百强房企裁员超50%</div>
    </div>
  </div>
  <div class="item final">
    <div class="item-num">1</div>
    <div class="item-info">
      <div class="item-name">互联网科技</div>
      <div class="item-data">阿里裁员34% · 静默裁员成常态</div>
    </div>
  </div>
</div>
</body>
</html>
