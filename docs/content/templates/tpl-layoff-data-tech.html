<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, "PingFang SC", sans-serif; background: #0a0a0a; width: 1080px; height: 1920px; overflow: hidden; color: #ffffff; }
.rank { position: absolute; top: 60px; left: 60px; font-size: 240px; font-weight: 900; color: #ff0000; opacity: 0.2; line-height: 1; }
.industry { position: absolute; top: 280px; left: 60px; right: 60px; }
.industry-label { font-size: 28px; color: #ff4444; letter-spacing: 4px; font-weight: 700; }
.industry-name { font-size: 72px; font-weight: 800; color: #ffffff; margin-top: 8px; }
.two-col { position: absolute; top: 480px; left: 60px; right: 60px; display: flex; gap: 40px; }
.col { flex: 1; text-align: center; }
.col-label { font-size: 32px; color: #888888; margin-bottom: 20px; }
.col-number { font-size: 160px; font-weight: 900; color: #ff0000; line-height: 1; }
.col-unit { font-size: 48px; color: #ff4444; }
.col-sub { font-size: 24px; color: #555555; margin-top: 16px; }
.alert { position: absolute; top: 1100px; left: 60px; right: 60px; background: #1a0000; border: 3px solid #ff0000; border-radius: 24px; padding: 60px 50px; text-align: center; }
.alert-title { font-size: 56px; color: #ff0000; font-weight: 800; margin-bottom: 20px; }
.alert-text { font-size: 36px; color: #ffffff; line-height: 1.6; }
.source { position: absolute; bottom: 60px; left: 60px; font-size: 22px; color: #444444; }
</style>
</head>
<body>
<div class="rank">1</div>
<div class="industry">
  <div class="industry-label">NO.1</div>
  <div class="industry-name">互联网科技</div>
</div>
<div class="two-col">
  <div class="col">
    <div class="col-label">头部电商</div>
    <div class="col-number">30<span class="col-unit">%+</span></div>
    <div class="col-sub">年度组织调整</div>
  </div>
  <div class="col">
    <div class="col-label">行业普遍</div>
    <div class="col-number">持续</div>
    <div class="col-sub">优化调整中</div>
  </div>
</div>
<div class="alert">
  <div class="alert-title">静默优化</div>
  <div class="alert-text">不公开裁，逼你自己走<br/>连赔偿金都省了</div>
</div>
<div class="source">数据来源：公开报道 / 行业研究</div>
</body>
</html>
