<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, "PingFang SC", sans-serif; background: #0a0a0a; width: 1080px; height: 1920px; overflow: hidden; color: #ffffff; }
.rank { position: absolute; top: 80px; left: 60px; font-size: 200px; font-weight: 900; color: #ff3333; opacity: 0.15; line-height: 1; }
.industry { position: absolute; top: 260px; left: 60px; right: 60px; }
.industry-label { font-size: 28px; color: #888888; letter-spacing: 4px; text-transform: uppercase; }
.industry-name { font-size: 72px; font-weight: 800; color: #ffffff; margin-top: 8px; }
.stat-block { position: absolute; top: 520px; left: 60px; right: 60px; text-align: center; }
.big-number { font-size: 240px; font-weight: 900; color: #ff3333; line-height: 1; letter-spacing: -4px; }
.big-unit { font-size: 64px; color: #ff6666; margin-top: 16px; }
.sub-stats { position: absolute; top: 1050px; left: 60px; right: 60px; }
.sub-item { margin-bottom: 40px; }
.sub-value { font-size: 56px; font-weight: 700; color: #ffffff; }
.sub-desc { font-size: 28px; color: #666666; margin-top: 8px; }
.divider { width: 80px; height: 4px; background: #ff3333; margin: 20px 0; }
.source { position: absolute; bottom: 60px; left: 60px; font-size: 22px; color: #444444; }
</style>
</head>
<body>
<div class="rank">2</div>
<div class="industry">
  <div class="industry-label">NO.2</div>
  <div class="industry-name">房地产</div>
</div>
<div class="stat-block">
  <div class="big-number">50%+</div>
  <div class="big-unit">百强房企裁员比例</div>
</div>
<div class="sub-stats">
  <div class="sub-item">
    <div class="divider"></div>
    <div class="sub-value">寒冬持续 3年未触底</div>
    <div class="sub-desc">百强房企过半在裁员</div>
  </div>
  <div class="sub-item">
    <div class="divider"></div>
    <div class="sub-value">建材/装修/中介全遭殃</div>
    <div class="sub-desc">上下游产业链崩塌</div>
  </div>
</div>
<div class="source">数据来源：国家统计局</div>
</body>
</html>
