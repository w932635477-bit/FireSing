<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, "PingFang SC", sans-serif; background: #0a0a0a; width: 1080px; height: 1920px; overflow: hidden; }

/* Subtle gradient bg */
.bg-gradient { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: radial-gradient(ellipse at 50% 30%, rgba(255,152,0,0.08) 0%, transparent 60%); }

.content { position: relative; z-index: 1; padding: 100px 50px; text-align: center; }

/* Top label */
.top-label { font-size: 28px; color: #666; letter-spacing: 4px; margin-bottom: 60px; }

/* Center question */
.question { font-size: 56px; font-weight: 700; color: #fff; line-height: 1.4; margin-bottom: 20px; }
.price-tag { display: inline-block; background: #ff9800; color: #000; padding: 8px 24px; border-radius: 12px; font-size: 48px; font-weight: 900; margin-top: 10px; }

/* Vote area */
.vote-area { display: flex; justify-content: center; gap: 80px; margin-top: 80px; }
.vote-option { text-align: center; }
.vote-circle { width: 240px; height: 240px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; position: relative; }
.vote-circle.yes { background: rgba(76,175,80,0.15); border: 3px solid #4caf50; }
.vote-circle.no { background: rgba(244,67,54,0.15); border: 3px solid #f44336; }
.vote-emoji { font-size: 80px; }
.vote-label { font-size: 36px; font-weight: 700; margin-bottom: 8px; }
.vote-label.yes { color: #4caf50; }
.vote-label.no { color: #f44336; }
.vote-pct { font-size: 52px; font-weight: 900; }
.vote-pct.yes { color: #4caf50; }
.vote-pct.no { color: #f44336; }
.vote-count { font-size: 24px; color: #666; margin-top: 4px; }

/* VS divider */
.vs { display: flex; align-items: center; justify-content: center; }
.vs-text { font-size: 48px; font-weight: 900; color: #444; }

/* Progress bar */
.progress-area { margin-top: 80px; padding: 0 50px; }
.progress-bar { height: 16px; border-radius: 8px; overflow: hidden; display: flex; background: #222; }
.progress-fill-yes { height: 100%; background: #4caf50; border-radius: 8px 0 0 8px; width: 67%; }
.progress-fill-no { height: 100%; background: #f44336; border-radius: 0 8px 8px 0; width: 33%; }
.progress-labels { display: flex; justify-content: space-between; margin-top: 12px; }
.progress-label { font-size: 22px; color: #666; }

/* Bottom CTA */
.cta-area { position: absolute; bottom: 120px; left: 0; right: 0; text-align: center; z-index: 1; }
.cta-text { font-size: 32px; color: #ff9800; font-weight: 600; animation: blink 1.2s infinite; }
@keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
.cta-sub { font-size: 24px; color: #555; margin-top: 10px; }
</style>
</head>
<body>
<div class="bg-gradient"></div>

<div class="content">
  <div class="top-label">DAY 3 投票</div>
  <div class="question">AI画的头像<br>卖10块钱</div>
  <div class="price-tag">¥10</div>

  <div class="vote-area">
    <div class="vote-option">
      <div class="vote-circle yes">
        <span class="vote-emoji">&#128077;</span>
      </div>
      <div class="vote-label yes">值</div>
      <div class="vote-pct yes">67%</div>
      <div class="vote-count">1,234 票</div>
    </div>

    <div class="vs">
      <span class="vs-text">VS</span>
    </div>

    <div class="vote-option">
      <div class="vote-circle no">
        <span class="vote-emoji">&#128078;</span>
      </div>
      <div class="vote-label no">不值</div>
      <div class="vote-pct no">33%</div>
      <div class="vote-count">617 票</div>
    </div>
  </div>
</div>

<div class="progress-area">
  <div class="progress-bar">
    <div class="progress-fill-yes"></div>
    <div class="progress-fill-no"></div>
  </div>
  <div class="progress-labels">
    <span class="progress-label">&#128077; 值得</span>
    <span class="progress-label">割韭菜 &#128078;</span>
  </div>
</div>

<div class="cta-area">
  <div class="cta-text">评论区吵起来了</div>
  <div class="cta-sub">你怎么看？留言投票</div>
</div>
</body>
</html>
